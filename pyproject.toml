[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-latent-vla"
version = "0.1.0"
description = "Atomic Motion Coordinate for π0.5 training and force-responsive inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<2",
  "pyarrow>=14",
  "torch>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
